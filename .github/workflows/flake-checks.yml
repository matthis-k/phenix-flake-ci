# Reusable exact-head Nix check workflow; the caller owns all check definitions.
name: Generic flake check matrix
on:
  workflow_call:
    inputs:
      config:
        description: Path to the consumer's Nix check strategy configuration
        type: string
        required: true
      library_ref:
        description: Exact commit of the called phenix-flake-ci workflow
        type: string
        required: true
      cache_max_store_size_linux:
        description: Maximum Linux Nix store retained in the shared Actions cache
        type: string
        default: "6G"

permissions:
  contents: read

concurrency:
  group: flake-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Evaluate exact-head Nix inventory
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      digest: ${{ steps.plan.outputs.digest }}
      cache_prefix: ${{ steps.plan.outputs.cache_prefix }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: matthis-k/phenix-flake-ci
          ref: ${{ inputs.library_ref }}
          path: .ci-tools/flake-ci
          persist-credentials: false
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Create full inventory and deterministic plan
        id: plan
        shell: bash
        env:
          CONFIG_FILE: ${{ inputs.config }}
        run: |
          set -euo pipefail
          mkdir -p ci-plan
          nix eval --json --file "$CONFIG_FILE" > ci-plan/config.json
          python3 .ci-tools/flake-ci/lib/flake-check-plan.py plan \
            --config ci-plan/config.json --output ci-plan/plan.json
          python3 -m json.tool ci-plan/plan.json >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flake-check-plan
          path: ci-plan/
          if-no-files-found: error

  prebuild:
    name: Shared Nix build and cache writer
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: matthis-k/phenix-flake-ci
          ref: ${{ inputs.library_ref }}
          path: .ci-tools/flake-ci
          persist-credentials: false
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flake-check-plan
          path: ci-plan
      - name: Restore and save shared Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: ${{ needs.plan.outputs.cache_prefix }}-${{ github.sha }}
          # PRs may read a trusted main-branch Nix closure using the
          # identical lockfile/strategy identity. This does not expose OIDC,
          # delegate secrets, or give PRs write access to main's cache.
          # Prefer the warm main closure over an older PR-only snapshot.
          restore-prefixes-first-match: |
            remote-${{ needs.plan.outputs.cache_prefix }}-
            ${{ needs.plan.outputs.cache_prefix }}-
          gc-max-store-size-linux: ${{ inputs.cache_max_store_size_linux }}
      - name: Prebuild shared declared packages
        shell: bash
        run: |
          set -euo pipefail
          python3 .ci-tools/flake-ci/lib/flake-check-plan.py prebuild \
            --plan ci-plan/plan.json --output ci-plan/prebuild.json \
            --gc-roots-dir "${RUNNER_TEMP}/phenix-shared-prebuild-roots" \
            2>&1 | tee ci-plan/prebuild-build.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flake-prebuild-evidence
          path: |
            ci-plan/prebuild.json
            ci-plan/prebuild-build.log
          if-no-files-found: error

  shard:
    name: Check ${{ matrix.id }}
    needs: [plan, prebuild]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: matthis-k/phenix-flake-ci
          ref: ${{ inputs.library_ref }}
          path: .ci-tools/flake-ci
          persist-credentials: false
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flake-check-plan
          path: ci-plan
      - name: Restore shared cache read-only
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: ${{ needs.plan.outputs.cache_prefix }}-${{ github.sha }}
          restore-prefixes-first-match: |
            ${{ needs.plan.outputs.cache_prefix }}-
          save: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flake-prebuild-evidence
          path: ci-plan
      - name: Require shared outputs locally before building checks
        run: |
          python3 .ci-tools/flake-ci/lib/flake-check-plan.py prebuild-local \
            --plan ci-plan/plan.json --prebuild ci-plan/prebuild.json
      - name: Execute full shard and record actual Nix outputs
        shell: bash
        env:
          SHARD: ${{ matrix.id }}
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          # Preserve direct Nix build events without hiding build failures.
          python3 .ci-tools/flake-ci/lib/flake-check-plan.py build \
            --plan ci-plan/plan.json --shard "$SHARD" --output ci-evidence/evidence.json \
            2>&1 | tee ci-evidence/build.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: flake-shard-${{ matrix.id }}
          path: ci-evidence/
          if-no-files-found: error

  result:
    name: Flake matrix evidence aggregate
    if: always()
    needs: [plan, prebuild, shard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: matthis-k/phenix-flake-ci
          ref: ${{ inputs.library_ref }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flake-check-plan
          path: ci-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flake-prebuild-evidence
          path: ci-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: flake-shard-*
          path: ci-evidence
      - name: Require successful complete exact-head evidence
        shell: bash
        env:
          PLAN_STATUS: ${{ needs.plan.result }}
          BUILD_STATUS: ${{ needs.prebuild.result }}
          SHARD_STATUS: ${{ needs.shard.result }}
        run: |
          set -euo pipefail
          test "$PLAN_STATUS" = success
          test "$BUILD_STATUS" = success
          test "$SHARD_STATUS" = success
          python3 lib/flake-check-plan.py verify --plan ci-plan/plan.json \
            --prebuild ci-plan/prebuild.json --directory ci-evidence
      - name: Report Nix derivations rebuilt across shards
        shell: bash
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r shard; do
            log="ci-evidence/flake-shard-${shard}/build.log"
            test -f "$log" || { echo "Missing successful shard build log: $log" >&2; exit 1; }
            args+=(--shard "${shard#shard-}=$log")
          done < <(jq -r '.shards[].id' ci-plan/plan.json)
          # The preceding evidence gate proves all shards succeeded. Zero local
          # builds is therefore a valid fully cached result, not missing data.
          test -f ci-plan/prebuild-build.log || { echo "Missing prebuild log" >&2; exit 1; }
          python3 lib/shard-build-report.py --allow-zero-builds \
            --prebuild-log ci-plan/prebuild-build.log "${args[@]}" \
            > ci-evidence/duplicate-builds.json
          cat ci-evidence/duplicate-builds.json
          {
            echo "### Nix derivation build reuse across shards"
            echo "| Metric | Count |"
            echo "| --- | ---: |"
            jq -r '"| Shard build events | \(.build_events) |", "| Prebuild events | \(.prebuild_build_events) |", "| Unique derivations (pipeline) | \(.pipeline_distinct_derivation_paths) |", "| Rebuilt after prebuild | \(.repeated_events_after_prebuild) |", "| Rebuilt across shards | \(.repeated_events_across_shards) |", "| Repeated events (pipeline) | \(.pipeline_repeated_build_events) |"' ci-evidence/duplicate-builds.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flake-duplicate-builds
          path: ci-evidence/duplicate-builds.json
          if-no-files-found: error
