name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Show immutable flake identity for downstream consumers
        env:
          SOURCE_REV: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          nix flake prefetch --json "github:${GITHUB_REPOSITORY}/${SOURCE_REV}" |
            jq -ce --arg rev "$SOURCE_REV" '
              {rev: $rev, narHash: (.locked.narHash // .hash),
               locked: .locked, path: .storePath}
              | select(.narHash | type == "string" and startswith("sha256-"))
            '

      - name: Test declarative assertions and negative cases
        run: python3 lib/test-test-runner.py -v

      - name: Exercise declarative tests as Nix check derivations
        run: |
          set -euo pipefail
          fixture=./tests/declarative-test-consumer
          nix build --no-write-lock-file --no-link \
            "$fixture#checks.x86_64-linux.cli" \
            "$fixture#checks.x86_64-linux.expected-failure" \
            "$fixture#checks.x86_64-linux.lifecycle" \
            "$fixture#checks.x86_64-linux.references" \
            "$fixture#checks.x86_64-linux.file-content" \
            "$fixture#checks.x86_64-linux.matrix-status" \
            "$fixture#checks.x86_64-linux.matrix-invalid" \
            "$fixture#checks.x86_64-linux.multi-artifact"
          path="$(nix build --no-write-lock-file --no-link --print-out-paths "$fixture#checks.x86_64-linux.cli")"
          test -s "$path/result.json"
          if nix build --no-write-lock-file --no-link "$fixture#packages.x86_64-linux.assertion-fails"; then
            echo "invalid expectation unexpectedly succeeded" >&2
            exit 1
          fi

      - name: Verify prebuilt process scenario runs without tester-side compilation
        run: |
          set -euo pipefail
          for case in rpc rpc-repeat; do
            target="./tests/declarative-test-consumer#packages.x86_64-linux.\"test.${case}\""
            nix build --no-write-lock-file --no-link "$target"
            nix run --no-write-lock-file --offline --no-substitute --max-jobs 0 "$target"
          done

      - name: Exercise full exact-head runtime package plan, NAR and evidence path
        run: |
          set -euo pipefail
          mkdir -p ci-offline-runtime
          tmp="$PWD/ci-offline-runtime"
          cp lib/flake-test-packages.py "$tmp/runner.py"
          cp lib/test_services.py "$tmp/test_services.py"
          (
            cd tests/declarative-test-consumer
            runner=../../lib/flake-test-packages.py
            python3 "$runner" plan --system x86_64-linux --output "$tmp/plan.json"
            python3 "$runner" build --plan "$tmp/plan.json" --root "$tmp/test-roots"
            python3 "$runner" export --plan "$tmp/plan.json" --output "$tmp/closure.nar"
            python3 "$runner" batch --plan "$tmp/plan.json" \
              --names-json '["rpc","rpc-repeat"]' \
              --closure "$tmp/closure.nar" --results "$tmp/results"
            python3 "$runner" verify --plan "$tmp/plan.json" --results "$tmp/results"
          )

      - name: Upload prebuilt runtime closure for independent runner
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-runtime-handoff
          path: |
            ci-offline-runtime/runner.py
            ci-offline-runtime/test_services.py
            ci-offline-runtime/plan.json
            ci-offline-runtime/closure.nar
          if-no-files-found: error
          compression-level: 1

      - name: Test dependency impact planner
        run: python3 lib/test-cargo-impact.py -v

      - name: Test exact-head Nix check planner
        run: python3 lib/test-flake-check-plan.py -v

      - name: Test generated native Nix DAG scheduler
        run: python3 lib/test-flake-check-dag.py -v

      - name: Test untrusted single-store Nix DAG workflow boundaries
        run: python3 lib/test-local-dag-workflow.py -v

      - name: Test generated DAG stages and store transfers
        run: python3 lib/test-flake-dag-stages.py -v

      - name: Verify shared cache retention and read-only shards
        run: python3 lib/test-cache-retention-workflows.py -v

      - name: Test generic executable test package discovery and evidence
        run: python3 lib/test-flake-test-packages.py -v

      - name: Test generic precompiled Cargo group selection
        run: python3 lib/test-cargo-test-runner.py -v

      - name: Test Cargo precompiled executable packaging
        run: python3 lib/test-cargo-test-artifacts.py -v

      - name: Build and execute Cargo fixture after artifact compilation
        run: |
          set -euo pipefail
          fixture=./tests/cargo-test-consumer
          test_package="$(nix build --no-write-lock-file --no-link --print-out-paths ./tests/cargo-test-consumer)"
          nix run --no-write-lock-file ./tests/cargo-test-consumer
          nix run --no-write-lock-file './tests/cargo-test-consumer#packages.x86_64-linux."test.cargo-generic-cargo-test-fixture"'
          nix run --no-write-lock-file './tests/cargo-test-consumer#packages.x86_64-linux."test.cargo-generic-cargo-child"'
          test -s "$test_package/cargo-tests.json"
          test -d "$test_package/libexec"
          # A matrix prebuild can refer to the exact compiled test corpus
          # rather than choosing an arbitrary per-crate wrapper.
          shared="$(nix build --no-write-lock-file --no-link --print-out-paths \
            './tests/cargo-test-consumer#packages.x86_64-linux.cargo-workspace-tests')"
          wrapper="$(nix build --no-write-lock-file --no-link --print-out-paths \
            './tests/cargo-test-consumer#packages.x86_64-linux."test.cargo-generic-cargo-child"')"
          nix path-info --recursive "$wrapper" | grep -Fx "$shared"
          # Named checks share one Nix corpus per Cargo feature profile.
          nix build --no-write-lock-file --no-link \
            "$fixture#checks.x86_64-linux.root" \
            "$fixture#checks.x86_64-linux.child" \
            "$fixture#checks.x86_64-linux.integration" \
            "$fixture#checks.x86_64-linux.no-default" \
            "$fixture#checks.x86_64-linux.cargo-generic-cargo-test-fixture" \
            "$fixture#checks.x86_64-linux.cargo-generic-cargo-child" \
            "$fixture#checks.x86_64-linux.cargo-no-default" \
            "$fixture#checks.x86_64-linux.clippy" \
            "$fixture#checks.x86_64-linux.format" \
            "$fixture#checks.x86_64-linux.fixture-smoke"
          main_corpus="$(nix build --no-write-lock-file --no-link --print-out-paths \
            "$fixture#packages.x86_64-linux.cargo-tests-default")"
          no_default_corpus="$(nix build --no-write-lock-file --no-link --print-out-paths \
            "$fixture#packages.x86_64-linux.cargo-tests-no-default")"
          test -n "$main_corpus" && test -n "$no_default_corpus"
          test "$main_corpus" != "$no_default_corpus"

      - name: Test generated Tailscale SSH remote-builder configuration
        run: python3 lib/test-nix-remote-workers.py -v

      - name: Test exact-head remote benchmark comparator
        run: python3 lib/test-compare-remote-benchmarks.py -v

      - name: Test full Nix workflow critical-path reporter
        run: python3 lib/test-critical-path-report.py -v

      - name: Test actual per-shard Nix build duplication reporter
        run: python3 lib/test-shard-build-report.py -v

      - name: Print exact consumer flake source identity
        if: github.ref == 'refs/heads/main'
        run: nix flake prefetch --json "github:${GITHUB_REPOSITORY}/${GITHUB_SHA}"

      - name: Evaluate library tests
        run: nix eval --json .#lib.tests

      - name: Exercise command-scoped package closure
        run: |
          set -euo pipefail
          fixture=./tests/command-scoped-consumer

          nix run --no-write-lock-file "$fixture#fix" -- fix
          nix run --no-write-lock-file "$fixture#aggregate" -- aggregate
          nix run --no-write-lock-file "$fixture#dependent" -- dependent
          nix run --no-write-lock-file "$fixture#dispatcher" -- fix

          root_index="$(nix run --quiet --no-write-lock-file "$fixture#dispatcher" -- index)"
          printf '%s\n' "$root_index" | jq -e '
            .schemaVersion == 1
            and .commands.fix.path == ["fix"]
            and .commands.dependent.dependencies == ["fix"]
            and .hooks["pre-commit"].command == "fix"
            and .hooks["pre-commit"].path == ".githooks/pre-commit"
            and (.commands.fix.execution.program | startswith("/nix/store/"))
            and .commands.fix.execution.args == ["fix"]
          ' >/dev/null

          scoped_index="$(nix run --quiet --no-write-lock-file "$fixture#fix" -- index)"
          printf '%s\n' "$scoped_index" | jq -e '
            .scope.command == "fix"
            and .commands.fix.path == ["fix"]
            and (.commands | has("check") | not)
            and .hooks == {}
          ' >/dev/null

          printf '%s\n' '{"command":"fix","source":{"type":"test"}}' |
            nix run --quiet --no-write-lock-file "$fixture#fix" -- invoke

          if printf '%s\n' '{"command":"check"}' |
            nix run --quiet --no-write-lock-file "$fixture#fix" -- invoke; then
            echo "scoped executable invoked a command outside its index" >&2
            exit 1
          fi

          fix_path="$(nix build --no-write-lock-file --no-link --print-out-paths "$fixture#fix")"
          unrelated_path="$(nix build --no-write-lock-file --no-link --print-out-paths "$fixture#unrelated-tool")"

          if nix path-info --recursive "$fix_path" | grep -Fx "$unrelated_path"; then
            echo "command-scoped fix closure contains unrelated check tooling" >&2
            exit 1
          fi

          hooks_path="$(nix build --no-write-lock-file --no-link --print-out-paths "$fixture#git-hooks")"
          hook="$hooks_path/.githooks/pre-commit"
          test -x "$hook"
          grep -F 'nix run --quiet --no-write-lock-file ".#maintenance-command-' "$hook" >/dev/null
          grep -F '"command":"fix"' "$hook" >/dev/null
          if grep -F 'git config --local' "$hook" >/dev/null; then
            echo "tracked hook adapter mutates repository-local git config" >&2
            exit 1
          fi

          shell_hook="$(nix build --no-write-lock-file --no-link --print-out-paths "$fixture#shell-hook")"

          (
            repo="$(mktemp -d)"
            other_repo="$(mktemp -d)"
            trap 'rm -rf "$repo" "$other_repo"' EXIT
            git init -q "$repo"
            git init -q "$other_repo"
            cd "$repo"
            unset GIT_CONFIG_COUNT
            source "$shell_hook"

            test -z "$(git config --local --get core.hooksPath || true)"
            test "$(git config --get core.hooksPath)" = ".githooks"
            test -z "$(git -C "$other_repo" config --get core.hooksPath || true)"
          )

          (
            repo="$(mktemp -d)"
            trap 'rm -rf "$repo"' EXIT
            git init -q "$repo"
            git -C "$repo" config --local core.hooksPath custom-hooks
            cd "$repo"
            unset GIT_CONFIG_COUNT
            source "$shell_hook"

            test "$(git config --local --get core.hooksPath)" = "custom-hooks"
            test "$(git config --get core.hooksPath)" = "custom-hooks"
          )

      - name: Exercise semantic CI JSON reporting
        run: |
          set -euo pipefail
          fixture=./tests/semantic-ci-consumer
          log="$(mktemp)"

          if nix run --quiet --no-write-lock-file "$fixture#pipeline" -- pipeline >"$log"; then
            echo "semantic pipeline unexpectedly succeeded" >&2
            cat "$log" >&2
            exit 1
          fi

          jq -se '
            all(.[]; type == "object")
            and any(.[]; .type == "suite" and .phase == "build" and .suite == "compile" and .status == "pass" and (has("output") | not))
            and any(.[]; .type == "suite" and .phase == "test" and .suite == "a-failure" and .status == "fail" and .exit_code == 7 and (.output | contains("expected failure detail")))
            and any(.[]; .type == "suite" and .phase == "test" and .suite == "b-success" and .status == "pass" and (has("output") | not))
            and any(.[]; .type == "suite" and .phase == "runtime" and .suite == "startup" and .status == "pass" and (has("output") | not))
            and any(.[]; .type == "summary" and .status == "fail" and .failed_phases == ["test"])
          ' "$log" >/dev/null

          if grep -F "hidden build noise" "$log" || grep -F "hidden success noise" "$log" || grep -F "hidden runtime noise" "$log"; then
            echo "successful suite output leaked into quiet JSON reporting" >&2
            cat "$log" >&2
            exit 1
          fi

          nix run --quiet --no-write-lock-file "$fixture#test" -- test b-success >"$log"
          jq -se '
            length == 1
            and .[0].type == "suite"
            and .[0].phase == "test"
            and .[0].suite == "b-success"
            and .[0].status == "pass"
            and (.[0] | has("output") | not)
          ' "$log" >/dev/null

          nix run --quiet --no-write-lock-file "$fixture#test" -- test --verbose b-success >"$log"
          jq -se '
            length == 1
            and .[0].status == "pass"
            and (.[0].output | contains("hidden success noise"))
          ' "$log" >/dev/null

          nix run --quiet --no-write-lock-file "$fixture#test" -- test --list >"$log"
          jq -se '
            length == 2
            and all(.[]; .type == "suite_definition" and .phase == "test")
          ' "$log" >/dev/null

      - name: Evaluate flake
        run: nix flake check --no-build

  offline-runtime:
    name: Execute prebuilt packages without source checkout
    needs: eval
    if: needs.eval.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens =
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: offline-runtime-handoff
          path: handoff/
      - name: Verify isolated Nix closure and exact-head test evidence
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          handoff="$GITHUB_WORKSPACE/handoff"
          mkdir -p "$GITHUB_WORKSPACE/offline-results"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          cd "$work"
          test ! -e flake.nix
          test ! -d .git
          python3 "$handoff/runner.py" batch \
            --plan "$handoff/plan.json" \
            --closure "$handoff/closure.nar" \
            --names-json '["rpc","rpc-repeat"]' \
            --expected-commit "$EXPECTED_COMMIT" \
            --results "$GITHUB_WORKSPACE/offline-results"
          python3 "$handoff/runner.py" verify \
            --plan "$handoff/plan.json" \
            --results "$GITHUB_WORKSPACE/offline-results"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: offline-runtime-evidence
          path: offline-results/
          if-no-files-found: warn
