name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Evaluate library tests
        run: nix eval --json .#lib.tests

      - name: Exercise command-scoped package closure
        run: |
          set -euo pipefail
          fixture=./tests/command-scoped-consumer

          nix run --no-write-lock-file "$fixture#fix" -- fix
          nix run --no-write-lock-file "$fixture#aggregate" -- aggregate
          nix run --no-write-lock-file "$fixture#dependent" -- dependent
          nix run --no-write-lock-file "$fixture#dispatcher" -- fix

          root_index="$(nix run --quiet --no-write-lock-file "$fixture#dispatcher" -- index)"
          printf '%s\n' "$root_index" | jq -e '
            .schemaVersion == 1
            and .commands.fix.path == ["fix"]
            and .commands.dependent.dependencies == ["fix"]
            and .hooks["pre-commit"].command == "fix"
            and .hooks["pre-commit"].path == ".githooks/pre-commit"
            and (.commands.fix.execution.program | startswith("/nix/store/"))
            and .commands.fix.execution.args == ["fix"]
          ' >/dev/null

          scoped_index="$(nix run --quiet --no-write-lock-file "$fixture#fix" -- index)"
          printf '%s\n' "$scoped_index" | jq -e '
            .scope.command == "fix"
            and .commands.fix.path == ["fix"]
            and (.commands | has("check") | not)
            and .hooks == {}
          ' >/dev/null

          printf '%s\n' '{"command":"fix","source":{"type":"test"}}' |
            nix run --quiet --no-write-lock-file "$fixture#fix" -- invoke

          if printf '%s\n' '{"command":"check"}' |
            nix run --quiet --no-write-lock-file "$fixture#fix" -- invoke; then
            echo "scoped executable invoked a command outside its index" >&2
            exit 1
          fi

          fix_path="$(nix build --no-write-lock-file --no-link --print-out-paths "$fixture#fix")"
          unrelated_path="$(nix build --no-write-lock-file --no-link --print-out-paths "$fixture#unrelated-tool")"

          if nix path-info --recursive "$fix_path" | grep -Fx "$unrelated_path"; then
            echo "command-scoped fix closure contains unrelated check tooling" >&2
            exit 1
          fi

          hooks_path="$(nix build --no-write-lock-file --no-link --print-out-paths "$fixture#git-hooks")"
          hook="$hooks_path/.githooks/pre-commit"
          test -x "$hook"
          grep -F 'nix run --quiet --no-write-lock-file ".#maintenance-command-' "$hook" >/dev/null
          grep -F '"command":"fix"' "$hook" >/dev/null
          if grep -F 'git config --local' "$hook" >/dev/null; then
            echo "tracked hook adapter mutates repository-local git config" >&2
            exit 1
          fi

          shell_hook="$(nix build --no-write-lock-file --no-link --print-out-paths "$fixture#shell-hook")"

          (
            repo="$(mktemp -d)"
            other_repo="$(mktemp -d)"
            trap 'rm -rf "$repo" "$other_repo"' EXIT
            git init -q "$repo"
            git init -q "$other_repo"
            cd "$repo"
            unset GIT_CONFIG_COUNT
            source "$shell_hook"

            test -z "$(git config --local --get core.hooksPath || true)"
            test "$(git config --get core.hooksPath)" = ".githooks"
            test -z "$(git -C "$other_repo" config --get core.hooksPath || true)"
          )

          (
            repo="$(mktemp -d)"
            trap 'rm -rf "$repo"' EXIT
            git init -q "$repo"
            git -C "$repo" config --local core.hooksPath custom-hooks
            cd "$repo"
            unset GIT_CONFIG_COUNT
            source "$shell_hook"

            test "$(git config --local --get core.hooksPath)" = "custom-hooks"
            test "$(git config --get core.hooksPath)" = "custom-hooks"
          )

      - name: Exercise semantic CI JSON reporting
        run: |
          set -euo pipefail
          fixture=./tests/semantic-ci-consumer
          log="$(mktemp)"

          if nix run --quiet --no-write-lock-file "$fixture#pipeline" -- pipeline >"$log"; then
            echo "semantic pipeline unexpectedly succeeded" >&2
            cat "$log" >&2
            exit 1
          fi

          jq -se '
            all(.[]; type == "object")
            and any(.[]; .type == "suite" and .phase == "build" and .suite == "compile" and .status == "pass" and (has("output") | not))
            and any(.[]; .type == "suite" and .phase == "test" and .suite == "a-failure" and .status == "fail" and .exit_code == 7 and (.output | contains("expected failure detail")))
            and any(.[]; .type == "suite" and .phase == "test" and .suite == "b-success" and .status == "pass" and (has("output") | not))
            and any(.[]; .type == "suite" and .phase == "runtime" and .suite == "startup" and .status == "pass" and (has("output") | not))
            and any(.[]; .type == "summary" and .status == "fail" and .failed_phases == ["test"])
          ' "$log" >/dev/null

          if grep -F "hidden build noise" "$log" || grep -F "hidden success noise" "$log" || grep -F "hidden runtime noise" "$log"; then
            echo "successful suite output leaked into quiet JSON reporting" >&2
            cat "$log" >&2
            exit 1
          fi

          nix run --quiet --no-write-lock-file "$fixture#test" -- test b-success >"$log"
          jq -se '
            length == 1
            and .[0].type == "suite"
            and .[0].phase == "test"
            and .[0].suite == "b-success"
            and .[0].status == "pass"
            and (.[0] | has("output") | not)
          ' "$log" >/dev/null

          nix run --quiet --no-write-lock-file "$fixture#test" -- test --verbose b-success >"$log"
          jq -se '
            length == 1
            and .[0].status == "pass"
            and (.[0].output | contains("hidden success noise"))
          ' "$log" >/dev/null

          nix run --quiet --no-write-lock-file "$fixture#test" -- test --list >"$log"
          jq -se '
            length == 2
            and all(.[]; .type == "suite_definition" and .phase == "test")
          ' "$log" >/dev/null

      - name: Evaluate flake
        run: nix flake check --no-build
